name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/per-server-workspaces"]

permissions:
  contents: read

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Security tests
        run: npm run test:security
